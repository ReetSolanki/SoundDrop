[package]
name = "SoundDrop"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http2", "macros", "ws"] }
tokio = { version = "1.52.2", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
mongodb = "2.8"
serde = { version = "1.0", features = ["derive"] }
futures = "0.3.32"
